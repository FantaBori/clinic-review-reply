<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>병의원 네이버 플레이스 리뷰 답글 생성기</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CLINIC_TYPES = [
      "치과", "피부과", "성형외과", "동물병원", "한의원", "정형외과", "안과", "내과/소아과", "기타 병의원"
    ];

    function App() {
      // 설정 값
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_key") || "");
      const [storeName, setStoreName] = useState(() => localStorage.getItem("clinic_name") || "연세힐치과의원");
      const [clinicType, setClinicType] = useState(() => localStorage.getItem("clinic_type") || "치과");
      const [customGreeting, setCustomGreeting] = useState(() => localStorage.getItem("clinic_greeting") || "안녕하세요, 연세힐치과입니다 🦷");

      // 입력 및 상태 값
      const [reviewText, setReviewText] = useState("");
      const [tone, setTone] = useState("caring");
      const [loading, setLoading] = useState(false);
      const [progress, setProgress] = useState(0);
      const [results, setResults] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");
      const [showInfoModal, setShowInfoModal] = useState(false);
      const [showKeyGuideModal, setShowKeyGuideModal] = useState(false);

      // 로컬 스토리지 저장
      const handleSaveKey = (val) => { setApiKey(val); localStorage.setItem("gemini_key", val); };
      const handleSaveStoreName = (val) => { setStoreName(val); localStorage.setItem("clinic_name", val); };
      const handleSaveClinicType = (val) => { setClinicType(val); localStorage.setItem("clinic_type", val); };
      const handleSaveGreeting = (val) => { setCustomGreeting(val); localStorage.setItem("clinic_greeting", val); };

      const generateReplies = async () => {
        const cleanKey = apiKey.trim();
        if (!cleanKey) {
          alert("우측 상단에 Gemini API Key를 입력해주세요!");
          return;
        }
        if (!reviewText.trim()) {
          alert("고객/환자 리뷰 내용을 입력해주세요!");
          return;
        }

        setLoading(true);
        setProgress(5);
        setErrorMsg("");
        setResults(null);

        const toneGuide = {
          caring: "환자의 마음을 진심으로 공감하고 따뜻하게 보살펴주는 안심/공감 어조",
          professional: "의료진으로서 신뢰감을 주며 진중하고 정중한 어조",
          friendly: "부담스럽지 않고 친근하며 미소를 머금은 다정한 어조"
        }[tone];

        const promptText = `
너는 대한민국 병의원(치과, 피부과, 내과, 동물병원 등) 네이버 플레이스 마케팅 및 환자 관리 전문가야.
의료기관 정보와 환자 리뷰를 바탕으로 네이버 리뷰 답글 3가지 버전을 작성해줘.

[병의원 기본 정보]
- 병원명: ${storeName}
- 진료 과목: ${clinicType}
- 시그니처 첫인사: ${customGreeting}

[환자/보호자 리뷰 정보]
- 리뷰 내용: "${reviewText}"
- 요구 어조: ${toneGuide}

[의료법 및 작성 가이드라인 (엄격 준수)]
1. 대한민국 의료법 제56조 준수: "100% 치료", "최고/최상", "부작용 없음", "완치 보장" 등의 과대/과장 표현은 절대 사용하지 말 것.
2. 긍정적 칭찬 리뷰:
   - 환자가 만족한 진료/시술 포인트를 짚어주고, 치료 후 케어(일상 주의사항)나 정기 검진 유도 문구를 부드럽게 포함할 것.
3. 불만/부정적 리뷰:
   - 감정적 대응이나 의료적 진위 여부 논쟁은 피하고, 환자가 느낀 불편함에 대해 진심 어린 공감과 사과를 전할 것.
   - 자세한 원인 파악 및 조치를 위해 병원 대표번호나 원내 실장/담당자에게 연락 주시면 빠르게 안내해 드리겠다는 안내(원내 해결 유도)를 포함할 것.
4. 네이버 플레이스 답글 특성에 맞게 2~4줄 내외로 깔끔하고 읽기 편하게 작성할 것.

[반드시 순수 JSON 형식으로만 응답할 것]
{
  "replies": [
    {
      "tag": "추천 1 (진심 공감/정석형)",
      "content": "첫 번째 답글 내용"
    },
    {
      "tag": "추천 2 (주의사항/사후케어 안내형)",
      "content": "두 번째 답글 내용"
    },
    {
      "tag": "추천 3 (신뢰감/정기검진 유도형)",
      "content": "세 번째 답글 내용"
    }
  ]
}
        `;

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:streamGenerateContent?key=${cleanKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: { temperature: 0.85 }
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const rawMsg = errData.error?.message || "";

            if (res.status === 429) {
              if (rawMsg.includes("Per-Day") || rawMsg.includes("RPD") || rawMsg.includes("quota")) {
                throw new Error("🛑 오늘 사용할 수 있는 구글 무료 API 한도(1,500회)를 다 썼습니다. 내일 다시 이용하시거나 새 키를 발급받아 주세요.");
              }

              const match = rawMsg.match(/retry in ([0-9.]+)s/i);
              const retrySeconds = match ? Math.ceil(parseFloat(match[1])) : 60;
              
              throw new Error(`⏳ 요청이 너무 빠릅니다! 구글 무료 API 한도(1분당 15회)에 걸렸으니 약 ${retrySeconds}초 뒤에 다시 눌러주세요.`);
            }

            throw new Error(`API 오류 (${res.status}): ${rawMsg || "요청 실패"}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let accumulatedText = "";
          const ESTIMATED_TOTAL_SIZE = 850; 

          setProgress(15);

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            accumulatedText += chunk;

            const currentSize = accumulatedText.length;
            const calculatedPct = Math.min(98, Math.floor((currentSize / ESTIMATED_TOTAL_SIZE) * 100));
            setProgress(Math.max(20, calculatedPct));
          }

          const jsonMatches = accumulatedText.match(/"text":\s*"([\s\S]*?)"/g) || [];
          let fullPromptOutput = "";
          
          jsonMatches.forEach(m => {
            try {
              const parsedText = JSON.parse("{" + m + "}").text;
              fullPromptOutput += parsedText;
            } catch(e) {}
          });

          if (!fullPromptOutput) {
            fullPromptOutput = accumulatedText;
          }

          const cleanedJson = fullPromptOutput.replace(/```json/g, "").replace(/
